services:
  mysql:
    image: mysql:8.0
    container_name: ghexp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: githubexplorer
      MYSQL_USER: ghexp_user
      MYSQL_PASSWORD: ghexp_pass
    ports:
      - "3306:3306"
    volumes:
      - ghexp-mysql-data:/var/lib/mysql
      # Init automatico dello schema al PRIMO avvio (volume vuoto):
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ghexp-mysql-data:
